# Desktop release matrix. Disabled until the Electron app exists (Phase 2).
name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  desktop:
    if: ${{ vars.DESKTOP_RELEASE_ENABLED == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run dist:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/release/*

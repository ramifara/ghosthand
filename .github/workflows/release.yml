# Desktop release matrix: unsigned Linux (AppImage, deb), Windows (NSIS) and macOS (dmg) builds.
# Runs on version tags (v*) and by hand (Actions → release → Run workflow). Artifacts are attached to the
# workflow run; publishing to GitHub Releases and code signing come later.
name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run dist:desktop
        env:
          # Unsigned until certificates exist: never look for a signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error

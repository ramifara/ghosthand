<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reports</title>
  </head>
  <body>
    <main>
      <h1>Reports</h1>
      <div id="content"><div class="spinner" role="progressbar" aria-label="Loading">Loading…</div></div>
    </main>
    <script>
      fetch("/slow-api")
        .then((r) => r.json())
        .then((data) => {
          // Render in two steps so the DOM keeps changing for a moment after the response.
          setTimeout(() => {
            document.getElementById("content").innerHTML = `<p>${data.message}</p>`;
            setTimeout(() => {
              const b = document.createElement("button");
              b.textContent = "Continue";
              document.getElementById("content").appendChild(b);
            }, 150);
          }, 100);
        });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hard DOM</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 0; }
      main { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; padding: 12px; }
      ul { list-style: none; margin: 0; padding: 4px; min-height: 90px; border: 1px solid #999; }
      li { padding: 6px; margin: 4px 0; border: 1px solid #ccc; background: #fff; user-select: none; }
      .dragging { pointer-events: none; position: relative; z-index: 5; }
      [role=menu] { position: absolute; background: #fff; border: 1px solid #333; padding: 4px; z-index: 10; }
      [role=menu] button { display: block; }
      .menu-wrap { position: relative; display: inline-block; }
      .menu-wrap [role=menu] { top: 100%; left: 0; }
      iframe { width: 360px; height: 140px; }
    </style>
  </head>
  <body>
    <main>
      <section aria-label="Sorting">
        <ul role="list" aria-label="Checklist" id="checklist">
          <li draggable="true" aria-dropeffect="move" data-id="a">Alpha step</li>
          <li draggable="true" aria-dropeffect="move" data-id="b">Beta step</li>
          <li draggable="true" aria-dropeffect="move" data-id="c">Gamma step</li>
        </ul>
        <p id="order">a,b,c</p>
      </section>
      <section aria-label="Board">
        <ul role="list" aria-label="Todo" aria-dropeffect="move" data-column="todo">
          <li aria-roledescription="draggable card" tabindex="0" data-card="1">Write tests</li>
        </ul>
        <ul role="list" aria-label="Done" aria-dropeffect="move" data-column="done"></ul>
        <p id="moved">nothing moved</p>
      </section>
      <section aria-label="Menus">
        <div class="menu-wrap" id="hover-wrap">
          <button type="button" aria-haspopup="menu" aria-expanded="false" id="hover-trigger">Workspace</button>
        </div>
        <table aria-label="Projects">
          <tbody>
            <tr tabindex="0" aria-haspopup="menu" aria-expanded="false" data-name="Nimbus"><td>Nimbus</td><td>4 members</td></tr>
            <tr tabindex="0" aria-haspopup="menu" aria-expanded="false" data-name="Orion"><td>Orion</td><td>9 members</td></tr>
          </tbody>
        </table>
        <p id="menu-result">no action</p>
        <form aria-label="Files">
          <label for="upload">Upload file</label>
          <input id="upload" type="file" />
          <p id="chosen">no file</p>
          <a href="/download.csv" download>Download CSV</a>
        </form>
        <div id="open-host"></div>
        <div id="closed-host"></div>
        <iframe title="Remote form" src="__OTHER_ORIGIN__/frame-inner.html"></iframe>
      </section>
    </main>
    <script>
      // HTML5 drag and drop: dropping an item on another puts it at that item's place.
      const list = document.getElementById("checklist");
      let dragged = null;
      for (const li of list.children) {
        li.addEventListener("dragstart", (e) => { dragged = li; e.dataTransfer.setData("text/plain", li.dataset.id); });
        li.addEventListener("dragover", (e) => e.preventDefault());
        li.addEventListener("drop", (e) => {
          e.preventDefault();
          if (!dragged || dragged === li) return;
          const items = [...list.children];
          if (items.indexOf(dragged) > items.indexOf(li)) list.insertBefore(dragged, li);
          else list.insertBefore(dragged, li.nextSibling);
          document.getElementById("order").textContent = [...list.children].map((x) => x.dataset.id).join(",");
        });
      }

      // Pointer-events kanban (no HTML5 drag and drop).
      let held = null;
      document.querySelectorAll("[data-card]").forEach((card) => {
        card.addEventListener("pointerdown", (e) => {
          held = { card, x: e.clientX, y: e.clientY, active: false };
          e.preventDefault();
        });
      });
      window.addEventListener("pointermove", (e) => {
        if (!held) return;
        const dx = e.clientX - held.x, dy = e.clientY - held.y;
        if (Math.hypot(dx, dy) > 4) held.active = true;
        if (held.active) { held.card.classList.add("dragging"); held.card.style.transform = `translate(${dx}px, ${dy}px)`; }
      });
      window.addEventListener("pointerup", (e) => {
        if (!held) return;
        const { card, active } = held;
        held = null;
        card.classList.remove("dragging");
        card.style.transform = "";
        if (!active) return;
        const column = document.elementsFromPoint(e.clientX, e.clientY).map((el) => el.closest("[data-column]")).find(Boolean);
        if (!column || column === card.parentElement) return;
        const copy = card.cloneNode(true);
        card.remove();
        column.append(copy);
        document.getElementById("moved").textContent = `moved to ${column.dataset.column}`;
      });

      // Hover menu: opens on mouseenter, a click on the trigger keeps it open.
      const wrap = document.getElementById("hover-wrap");
      const trigger = document.getElementById("hover-trigger");
      let hoverMenu = null;
      let closeTimer = 0;
      const openHover = () => {
        clearTimeout(closeTimer);
        if (hoverMenu) return;
        hoverMenu = document.createElement("div");
        hoverMenu.setAttribute("role", "menu");
        hoverMenu.setAttribute("aria-label", "Workspace");
        hoverMenu.innerHTML =
          '<button role="menuitemradio" aria-checked="false" type="button">Vega</button>' +
          '<button role="menuitemradio" aria-checked="true" type="button">Lyra</button>';
        hoverMenu.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
          document.getElementById("menu-result").textContent = `workspace ${b.textContent}`;
          hoverMenu.remove(); hoverMenu = null; trigger.setAttribute("aria-expanded", "false");
        }));
        wrap.append(hoverMenu);
        trigger.setAttribute("aria-expanded", "true");
      };
      wrap.addEventListener("mouseenter", openHover);
      wrap.addEventListener("mouseleave", () => {
        closeTimer = setTimeout(() => { hoverMenu?.remove(); hoverMenu = null; trigger.setAttribute("aria-expanded", "false"); }, 300);
      });
      trigger.addEventListener("click", openHover);

      // Context menu on rows: right-click or Shift+F10.
      let ctx = null;
      const openCtx = (row, x, y) => {
        ctx?.remove();
        document.querySelectorAll("tr[aria-expanded=true]").forEach((r) => r.setAttribute("aria-expanded", "false"));
        ctx = document.createElement("div");
        ctx.setAttribute("role", "menu");
        ctx.setAttribute("aria-label", `Actions for ${row.dataset.name}`);
        ctx.style.left = `${x}px`; ctx.style.top = `${y}px`; ctx.style.position = "fixed";
        ctx.innerHTML = '<button role="menuitem" type="button">Archive</button>';
        ctx.querySelector("button").addEventListener("click", () => {
          document.getElementById("menu-result").textContent = `archived ${row.dataset.name}`;
          ctx.remove(); ctx = null; row.setAttribute("aria-expanded", "false");
        });
        document.body.append(ctx);
        row.setAttribute("aria-expanded", "true");
      };
      document.querySelectorAll("tr[aria-haspopup]").forEach((row) => {
        row.addEventListener("contextmenu", (e) => { e.preventDefault(); openCtx(row, e.clientX, e.clientY); });
        row.addEventListener("keydown", (e) => {
          if (e.key === "ContextMenu" || (e.shiftKey && e.key === "F10")) {
            e.preventDefault();
            const r = row.getBoundingClientRect();
            openCtx(row, r.left + 10, r.bottom);
          }
        });
      });

      document.getElementById("upload").addEventListener("change", (e) => {
        document.getElementById("chosen").textContent = [...e.target.files].map((f) => f.name).join(", ") || "no file";
      });

      const open = document.getElementById("open-host").attachShadow({ mode: "open" });
      open.innerHTML = '<button type="button" id="b">Shadow save</button><span id="s"></span>';
      open.getElementById("b").addEventListener("click", () => { open.getElementById("s").textContent = "shadow saved"; });
      const closed = document.getElementById("closed-host").attachShadow({ mode: "closed" });
      closed.innerHTML = '<button type="button">Hidden save</button>';
    </script>
  </body>
</html>
